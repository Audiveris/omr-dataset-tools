#---------------------------------------------
# Configuration for A.Pacha Beethoven dataset
#---------------------------------------------
# Potentially 124 pages

# source folder
source: D:\\soft\\beethoven

# images sub-folder
images: .

# annotations sub-folder
annotations: .

# List of tasks to be actually performed
tasks:
  - histogram
  - checking
  - train
  - val

# Specifications for some visual checking
checking:
  output: data/bee-annotated-images # where to store the annotated images
  draw_name: true                   # draw class name rather than class rank?
  hidden_labels:                    # labels not to be drawn
    - staffLine
  required_labels:                  # limit to images containing any of these items
#    - octaveUp                            # line following the 8 (ottava) symbol
#    - ornamentTrill                       # like a long mordent
  use_train: true                  # select full train?
  use_val: false                    # select full val?
  selection:                        # list of selected images
  - String_Quartet_No.4_Op.18_No.4__Ludwig_van_Beethoven.mei~Leipzig~score_page_11.png

