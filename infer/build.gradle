    // classpath "gradle.plugin.com.github.viswaramamoorthy:gradle-util-plugins:0.1.0-RELEASE"
  // }
// }
// apply plugin: "com.github.ManifestClasspath"

repositories {
    mavenCentral()
    // mavenLocal()
    flatDir(dirs: 'dev/externals') // for libraries not in any other repository
}

// Declare Lombok appropriately to avoid deprecation warnings in Gradle >= 4.6
dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.38'
}

dependencies {
    implementation "org.deeplearning4j:deeplearning4j-core:${project.ext.dl4jVersion}"
    implementation "org.deeplearning4j:deeplearning4j-modelimport:${project.ext.dl4jVersion}"
    
    implementation "org.nd4j:nd4j-native:${project.ext.nd4jVersion}"
    implementation "org.nd4j:nd4j-onnxruntime:${project.ext.nd4jVersion}"

    implementation "args4j:args4j:2.37"

    implementation "org.slf4j:slf4j-api:2.0.17"
    implementation "ch.qos.logback:logback-classic:1.5.18"    

    // Runtime only are gathered here below
    runtimeOnly "org.nd4j:nd4j-backend-impls:${project.ext.nd4jVersion}"
    runtimeOnly "org.nd4j:nd4j-native:${project.ext.nd4jVersion}:${project.ext.targetOS}"
    runtimeOnly "org.bytedeco:javacpp:${project.ext.jcppVersion}:${project.ext.targetOS}"
}

